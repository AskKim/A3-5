name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - release
    paths-ignore:
      - 'old/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # A copy of this repository, or one whose Pages source is a branch, cannot deploy through
  # Actions: `configure-pages` fails before anything is built, turning every push red.
  # Ask the Pages API what this repository actually supports and skip cleanly when the
  # answer is "not here" — the deploy itself is unchanged once Pages allows Actions.
  guard:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - name: Check Pages availability
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          code=$(curl -sS -o /tmp/pages.json -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' "$api")
          build_type=$(jq -r '.build_type // "legacy"' /tmp/pages.json 2>/dev/null || echo unknown)
          echo "Pages API: HTTP ${code}, build_type=${build_type}"
          case "${code}" in
            200)
              if [ "${build_type}" = "workflow" ]; then
                echo "deploy=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              reason="Pages is served from a branch (build_type=${build_type}), so a branch push publishes the site and Actions cannot. Switch Settings → Pages → Build and deployment → Source to GitHub Actions to let this workflow deploy."
              ;;
            404)
              reason="This repository has no GitHub Pages site, so there is nothing to deploy to. Create one (Settings → Pages → Source: GitHub Actions) before running this workflow."
              ;;
            *)
              echo "deploy=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          echo "deploy=false" >> "$GITHUB_OUTPUT"
          {
            echo "### GitHub Pages deployment skipped"
            echo ""
            echo "${reason}"
            echo ""
            echo "The workflow is unchanged and will deploy again as soon as that is satisfied."
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: guard
    if: needs.guard.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # IMPORTANT: GitHub Pages deployment STRICTLY REQUIRES Bun (oven-sh/setup-bun).
      # Previous attempts switching this workflow from Bun to npm broke GitHub Pages builds.
      # Do NOT replace Bun with npm/Node in this workflow.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: |
          if [ -f bun.lock ] || [ -f bun.lockb ]; then
            bun install --frozen-lockfile
          else
            bun install
          fi

      - name: Run domain unit tests
        run: bun run test

      - name: Verify App Improvements Registry
        run: bun run verify:improvements

      - name: Verify layer boundaries and engine typecheck
        run: |
          bun run verify:layers
          bun run verify:engine
          bun run verify:extraction

      - name: Run TypeScript typecheck (lint)
        run: bun run lint

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build subpath-safe production bundle (Bun CLI --base)
        env:
          NODE_ENV: production
        run: |
          BASE_PATH="${{ steps.pages.outputs.base_path }}"
          if [ -z "$BASE_PATH" ]; then
            BASE_PATH="/"
          fi
          case "$BASE_PATH" in
            */) ;;
            *) BASE_PATH="${BASE_PATH}/" ;;
          esac
          bun run build --base="$BASE_PATH"
          bun run verify:chunks
          test -f dist/robots.txt || { echo "Missing dist/robots.txt" >&2; exit 1; }
          test -f dist/sitemap.xml || { echo "Missing dist/sitemap.xml" >&2; exit 1; }
          test -f dist/404.html || cp dist/index.html dist/404.html
          grep -q '"start_url":"./"' dist/manifest.webmanifest
          grep -q '"scope":"./"' dist/manifest.webmanifest
          grep -q '"id":"./"' dist/manifest.webmanifest
          if [ "$BASE_PATH" != "/" ]; then
            grep -q "${BASE_PATH}assets/" dist/index.html
            grep -q "${BASE_PATH}manifest.webmanifest" dist/index.html
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [guard, build]
    if: needs.guard.outputs.deploy == 'true'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
