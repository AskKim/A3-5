constraints:
  - Keep Core PWA strictly in React + Vite + TypeScript (ES2018 target) — never convert to Kotlin or Compose
  - Preserve BOOT_ENTRY_LOCK_CHECKSUMS (src/main.tsx, src/App.tsx, index.html) unless explicitly authorized
  - Maintain zero layer violations (scripts/layer-allowlist.json = []) and zero as any / @ts-ignore / @ts-expect-error
  - Component→storage runtime coupling may only shrink (scripts/ui-storage-coupling-budget.json); add an @app port rather than a new direct import
  - Do not modify or import /import/ staging files; keep Alpha 2 features intact with thin facades until callers migrate
decisions: Standalone /engine extraction waits until storage alignment, useBarnStore/webSqliteAdapter split, and shim retirement complete so extracted packages require zero rewrites
