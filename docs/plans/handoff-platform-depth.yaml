constraints:
  - Build order — this handoff is SECOND and is blocked until `docs/plans/handoff-platform-ingress.yaml` is fully [DONE] and deleted. Do not start it alongside or before that file: the coverage floors, precache/chunk ratchets and bridge conformance spec here must be measured against the post-ingress tree, not a baseline the first handoff is still changing.
  - No new user-facing features, no UI copy or layout changes, no dependency additions, upgrades or swaps.
  - Do not start the standalone `/engine` package and do not retitle `src/engine` (owner decision); the remaining [WIP] presenter extraction in handoff-modularity-reusability stays out of scope here.
  - Boot-locked entry files untouched; zero type escapes; `scripts/layer-allowlist.json` stays `[]` and `scripts/ui-storage-coupling-budget.json` stays empty.
  - Every new test must exercise shipped code paths; never weaken an assertion, skip a case or set a tolerance just to go green — a gate that cannot fail closed does not ship.
  - `npm run verify`, `npm run build` and `npm run verify:chunks` stay green after each milestone.
decisions: Depth lands as gates and adversarial tests rather than refactors, so the Alpha 2 baseline stays provably intact while the failure modes get covered.
verified: tsc=pending | test=pending | build=pending
