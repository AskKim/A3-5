constraints:
  - "Honest tests only — no snapshot-only suites, no always-true assertions, no skipping a module because its branch is awkward; if a branch cannot run in jsdom (raster OCR, real WebRTC media), leave it uncovered and say so in the commit"
  - "No `as any` / `@ts-ignore` / `@ts-expect-error`; prefer a typed fixture over a cast, and delete a contrived test rather than casting around it"
  - "Floors are measured minus about one point, set in the same commit that earns them, and only the newest registry entry pins the numbers; convert older numeric invariants to shape tokens so the next ratchet does not break them"
  - "Per-area thresholds exist so one area never pays for another; keep every area's floor at or below its measured value"
  - "Never hand-edit IMPROVEMENTS.md or PROMPT_CHANGES.md — add a registry entry in src/domain/improvements/registry-part-05.ts and run npm run regen:ledgers"
  - "Protected — src/main.tsx, src/App.tsx, index.html (SHA-256 boot lock) and prompts/master_system_prompt.md"
decisions: "Per-area thresholds plus a shared global floor, because the components bucket is the only large uncovered area and a single global number would let it hide behind domain coverage; coverage work stays on files no parallel chat is editing (components tests, storage tests, docs), and the boot-locked entry files are accepted as 0% rather than unlocked"
recipes:
  - "Add a slice — write the suite, run it, run npm run verify to measure, append a registry entry whose id is the remote max plus one, set floors to measured minus about one point where a whole point was earned, run npm run regen:ledgers and npm run verify:improvements, then the full gates, commit and push"
  - "Gates — npm run verify && npm run build && npm run verify:chunks && npm run lint in one command, logs to /tmp, never piping a gate through head without keeping its exit status. verify:chunks needs dist/ from the build step"
  - "Registry conflict on rebase — git checkout --ours -- src/domain/improvements/registry-part-05.ts IMPROVEMENTS.md, re-append the entry block with a fresh id (remote max plus one), run npm run regen:ledgers, git add -A, GIT_EDITOR=true git rebase --continue, then git commit --amend to fix the id in the message"
  - "Stale floor pin — verify:improvements fails with a Missing expected token message naming vitest.config.ts when an older entry pins numbers that moved; convert that entry's invariant to the shape tokens, keeping one owner per number"
  - "Push rejected — git fetch origin main, rebase, re-run the gates, push again; plain git push in the sandbox has no credentials, so push through the cloud Git integration. Never force"
  - "Coverage report — coverage/coverage-summary.json after a verify run; rank modules by uncovered statement count to pick the next slice"
environment:
  - "The sandbox has no outbound internet (api.open-meteo.com times out); only the cloud browser reaches external APIs, so live-network checks are browser-only and everything else must be stubbed"
  - "Vite runs with watch disabled, so a long-running dev server keeps serving the module graph it started with — restart it after editing source before checking a fix in the browser"
  - "jsdom has no RTCPeerConnection, no PointerEvent constructor and a clientWidth of 0; the Gantt tests rely on the 560px track fallback and fire pointer events on window"
  - "Dependencies are not restored with the workspace; run npm ci from the committed lockfile before any gate"
  - "Report blockers as limitations, not passes — an unviewed UI change is not verified, and a gate that could not run is not green"
