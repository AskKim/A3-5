goal: Add the platform capabilities the app has no implementation for at all — on-device reminders, share/open ingress, app lock, and the install/launch surface — without touching domain engines or moving the PWA off React
status:
  - [DONE] src/features/reminders/reminderSchedule.ts + __tests__ | Pure schedule builder over the existing task-calendar output: lead reminders always include the day itself, watermark keys never re-fire, snoozes defer the fire time, grace/horizon windows, UTC calendar math. The caller supplies species-adjusted offset days, so no biology lives in @features (IMP-170)
  - [DONE] src/app/ports/reminders.tsx + src/storage/reminderScheduler.ts | Port composes the `@features/reminders` schedule with a storage delivery primitive (storage may not import `@features`, so the app layer is the only place that knows both). Persisted opt-in in `pedigree.reminders.v1`, OS permission mapping, silent no-op when denied/unsupported/disabled/frozen, `ServiceWorkerRegistration.showNotification` with a tag per key and a delivered-key ring capped at 200, injectable port + provider (IMP-173)
  - [DONE] android-wrapper/.../Reminder*.kt | `ReminderNotifications.kt` (lazy channel, API 33 permission gate, tagged posts), `ReminderWorker.kt` (one WorkManager job per reminder, `Result.success()` on every path so a denied permission never retries), `ReminderScheduleBridge.kt` (`SCHEDULE_REMINDERS` -> `enqueueUniqueWork(REPLACE)` per key, past entries skipped, `SCHEDULE_REMINDERS_RESULT` reply). `POST_NOTIFICATIONS` added and the `verify:android` permission allowlist widened to exactly INTERNET + POST_NOTIFICATIONS; `work-runtime-ktx` is the only new dependency (IMP-174)
  - [DONE] android-wrapper/.../MainActivity.kt + AndroidManifest.xml | `IncomingFileBridge.kt` reads ACTION_VIEW (content:// URIs only) and ACTION_SEND (EXTRA_STREAM), parks the envelope until the page posts its first message, then emits `OPEN_EXTERNAL_FILE`. The manifest gained the two intent filters (json + sqlite) beside the single exported activity. Deviation from the sketch: payloads travel base64 inside the envelope (4 MiB cap, metadata only beyond it) instead of a `cacheDir` copy, because a WebView cannot read a cache path and a copy would fork the import controller
  - [DONE] src/native/pedigreeBridge.ts + src/app/ports/incomingFile.tsx | `scheduleNativeReminders()` posts SCHEDULE_REMINDERS and folds the result into diagnostics; `onIncomingFile()` normalizes OPEN_EXTERNAL_FILE (filename required, unknown source defaults to share, missing mimeType to octet-stream) and the port decodes base64 behind `isSupported` / `subscribe` / `readBytes`, with set/reset/provider injection like every other port. 5 port cases (IMP-174)
  - [TODO] (partial) vite.config.ts manifest | `display_override: [standalone]` and `launch_handler: navigate-existing` are in. `share_target`, `file_handlers`, `shortcuts`, `screenshots` and `handle_links` stay open: the app has no route surface (one `location.search` read, no hash router), so a share target would land on the start screen with the file dropped, and `screenshots` needs real captures rather than synthetic ones.
  - [TODO] (blocked) android-wrapper res/xml/shortcuts.xml | Long-press parity needs the same route surface the manifest row is waiting on: every shortcut intent must name a destination the PWA can open. Land it together with the web `shortcuts` entry once the app has an addressable route.
  - [TODO] (blocked) App lock + launch polish | BiometricPrompt and the splash theme are native UI surfaces that must be compiled and exercised on a device. Nothing in this environment can build an APK or run the prompt, so landing them here would mean unverified Kotlin and an unlock flow nobody has seen. Needs a device-capable run.
constraints:
  - Core PWA stays React + Vite + TypeScript (ES2018 target); `android-wrapper/` stays a thin WebView shell with no screens, engines or SQLite models.
  - Reminders are computed and delivered on-device only: no push service, no server, no analytics, no new outbound requests of any kind.
  - New permissions must be additive and opt-in; `allowBackup=false`, `usesCleartextTraffic=false` and the minimal permission footprint stay intact.
  - `src/main.tsx`, `src/App.tsx`, `index.html` are boot-locked (`BOOT_ENTRY_LOCK_CHECKSUMS`); any registration change there is additive and re-locked deliberately, never incidental.
  - Zero `as any` / `@ts-ignore` / `@ts-expect-error`; `@features/*` imports nothing from domain/storage/app/hooks/components; every component read goes through a `src/app/ports/` port so `scripts/ui-storage-coupling-budget.json` stays empty.
  - `npm run verify` plus `npm run build` and `npm run verify:chunks` before declaring any milestone done; `verify:android` covers the wrapper statically.
  - Build order — this handoff is FIRST. `docs/plans/handoff-platform-depth.yaml` must not be started until every milestone here is [DONE] and this file is deleted: the depth work ratchets coverage floors, precache/chunk budgets and a bridge conformance spec against the tree this handoff creates, so starting it early would measure a baseline that is about to change.
decisions: Delivery is scheduled on-device (WorkManager on Android, service-worker notification on web) instead of any push infrastructure, so offline-first and zero-telemetry both survive; ingress reuses the existing import controller rather than adding a second restore path.
verified: tsc=pass | test=pass (1,280 suite; 22 new bridge/port cases) | verify:android=pass (16 checks) | build=pass | chunks=pass
next_action: the web/native route surface (manifest shortcuts/share_target plus res/xml/shortcuts.xml) that milestones 6 and 7 both wait on, then app lock on a device-capable run.
