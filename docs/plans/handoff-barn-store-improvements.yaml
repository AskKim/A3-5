constraints:
  - The 200-key return surface is a public contract - grouping it into facades must not add, rename or remove keys (src/hooks/__tests__/barnStoreContract.keys.json stays byte-identical).
  - Restores and offloads stay inside enqueueStoreMutation; never call the *Unqueued variants from UI handlers.
  - Never add a new restore path that skips the pre-replace safety snapshot, and never let a restore replace the barn without a verified rollback copy.
  - No type escapes (as any / @ts-ignore / @ts-expect-error), no unrequested dependency upgrades, keep backupVault on its dynamic import so verify:chunks stays green.
  - src/App.tsx, src/main.tsx and index.html are boot-locked (BOOT_ENTRY_LOCK_CHECKSUMS) - no edits without explicit confirmation.
  - Registry invariants append at the end of an entry's list; mid-list insertion shifts rationale ordinals and fails verify:improvements.
decisions: Scope is the 18 suggestions from the 2026-11-27 sweep, grouped into seven work milestones (1-3, 4-5, 6-8, 9-10, 11-13, 14-17, 18) plus registry/docs; the number in each clause is the suggestion id from that list.
execution_policy:
  - A milestone's closure (register, verify, commit) is a checkpoint, not a turn boundary.
  - After each checkpoint, continue straight into the next milestone in the same run - no confirmation, no hand-back, no "next up is".
  - The run ends only when this handoff's remaining list is empty, or when the run budget forces a stop.
  - On a budget stop, report which milestones landed, which remain, and that budget - not a blocker - ended the run.
  - Missing tooling (coverage provider, jsdom harness, SDK) is added when the milestone needs it and reported as a limitation at the end, never used to stop early.
verified: tsc=pass | test=pass (785) | build=pass | chunks=pass | improvements=128/128 | contract=pass
